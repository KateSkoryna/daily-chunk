<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=VT323&amp;family=Pixelify+Sans&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 16px; display: flex; flex-direction: column; gap: 14px; background-color: #120E24; background-image: repeating-linear-gradient(0deg, rgba(243,239,230,0.04) 0, rgba(243,239,230,0.04) 1px, transparent 1px, transparent 4px); color: #F3EFE6; font-family: 'VT323', 'Pixelify Sans', monospace; font-size: 22px">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 24px; letter-spacing: 2px">
<a href="Menu.dc.html" aria-label="Back to menu" style="display: flex; align-items: center; gap: 8px; min-height: 44px; color: #2EE6D6"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M10 2 L4 8 L10 14"></path></svg><span>MENU</span></a>
</div>
<h1 style="margin: 0; font-family: 'Bungee', sans-serif; font-weight: 400; font-size: 34px; line-height: 1; text-shadow: 3px 0 #FF3D8B, -3px 0 #2EE6D6">MY ACCOUNT</h1>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px; background: #1B1636; border: 2px solid #5A4E96">
<span style="width: 64px; height: 64px; flex: none; display: flex; align-items: center; justify-content: center; background: #2EE6D6; color: #120E24; font-family: 'Bungee', sans-serif; font-size: 28px; box-shadow: 4px 4px 0 #FF3D8B">K</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; line-height: 1">
<span style="font-size: 26px">KATE</span>
<span style="font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; line-height: 20px; color: #A9A3C2">[your email] · Google sign-in</span>
<span style="font-size: 20px; color: #FFD23F">TEXAS RANGER · SINCE OCT 2026</span>
</span>
</div>
<div style="font-size: 22px; color: #FF3D8B; letter-spacing: 2px">01 / LEARNING PROFILE</div>
<div style="display: flex; flex-direction: column; border: 2px solid #5A4E96">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 12px"><span>NATIVE LANGUAGE</span><span style="color: #2EE6D6">RUSSIAN ›</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 12px; border-top: 2px solid #5A4E96"><span>GERMAN LEVEL</span><span style="color: #2EE6D6">B2 → C1 ›</span></div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-top: 2px solid #5A4E96">
<span>DAILY GOAL · NEW WORDS</span>
<div role="radiogroup" aria-label="Daily goal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{goals}}" as="g" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{g.checked}}" onClick="{{g.pick}}" style="{{g.style}}">{{g.label}}</button>
</sc-for>
</div>
</div>
</div>
<div style="font-size: 22px; color: #FF3D8B; letter-spacing: 2px">02 / DATA</div>
<div style="display: flex; flex-direction: column; border: 2px solid #5A4E96">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 12px"><span>PLAN</span><span style="color: #FFD23F">FREE · UPGRADE ›</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 12px; border-top: 2px solid #5A4E96"><span>EXPORT WORDS (CSV / ANKI)</span><span style="color: #2EE6D6">›</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 12px; border-top: 2px solid #5A4E96"><span>MY RECORDINGS</span><span style="color: #2EE6D6">42 ›</span></div>
</div>
<button type="button" style="margin-top: auto; min-height: 48px; background: transparent; border: 0; color: #FF3D8B; font-size: 22px; letter-spacing: 2px; cursor: pointer">DELETE ACCOUNT</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { goal: 5 };
renderVals() {
const goals = [3, 5, 10, 15].map((n) => {
const on = this.state.goal === n;
return { label: String(n), checked: on ? 'true' : 'false', pick: () => this.setState({ goal: n }), style: 'min-height: 48px; cursor: pointer; font-size: 24px; ' + (on ? 'background: #FFD23F; color: #120E24; border: 2px solid #FFD23F;' : 'background: #1B1636; color: #F3EFE6; border: 2px solid #7A6CC4;') };
});
return { goals };
}
}
</script>
</body>
</html>
