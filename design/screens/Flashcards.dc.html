<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task 1 Flashcards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=VT323&amp;family=Pixelify+Sans&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 16px; display: flex; flex-direction: column; gap: 16px; background-color: #120E24; background-image: repeating-linear-gradient(0deg, rgba(243,239,230,0.04) 0, rgba(243,239,230,0.04) 1px, transparent 1px, transparent 4px); color: #F3EFE6; font-family: 'VT323', 'Pixelify Sans', monospace; font-size: 22px">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 24px; letter-spacing: 2px">
<a href="Confirm.dc.html" aria-label="Quit lesson" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #2EE6D6"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M3 3 L17 17 M17 3 L3 17"></path></svg></a>
<span style="color: #A9A3C2">LESSON 13</span>
</div>
<div role="progressbar" aria-label="Lesson step 1 of 6" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 20px; letter-spacing: 2px"><span style="color: #FF3D8B">01 / FLASHCARDS</span><span style="color: #A9A3C2">+0 XP</span></div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px"><i style="display: block; height: 8px; background: #FFD23F; border-radius: 2px"></i><i style="display: block; height: 8px; background: #251E48; border-radius: 2px"></i><i style="display: block; height: 8px; background: #251E48; border-radius: 2px"></i><i style="display: block; height: 8px; background: #251E48; border-radius: 2px"></i><i style="display: block; height: 8px; background: #251E48; border-radius: 2px"></i><i style="display: block; height: 8px; background: #251E48; border-radius: 2px"></i></div>
</div>
<div style="font-size: 20px; color: #A9A3C2; letter-spacing: 1px">CARD 1 OF 4</div>
<button type="button" onClick="{{flip}}" aria-label="Flip card" style="{{cardStyle}}">
<sc-if value="{{front}}" hint-placeholder-val="{{true}}">
<span style="align-self: flex-start; display: flex; align-items: center; height: 32px; padding: 0 10px; background: #5AA9FF; color: #120E24; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 16px">der</span>
<span style="font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 36px; line-height: 42px; text-align: left">der Bahnhof</span>
<span style="font-size: 18px; color: #A9A3C2">TAP TO FLIP</span>
</sc-if>
<sc-if value="{{back}}" hint-placeholder-val="{{false}}">
<span style="display: flex; flex-direction: column; gap: 4px; text-align: left">
<span style="font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 22px; line-height: 28px">die Bahnhöfe <span style="font-family: 'VT323', monospace; font-weight: 400; font-size: 18px; color: #FFB547">PL.</span></span>
<span style="font-family: 'IBM Plex Sans', sans-serif; font-size: 17px; line-height: 26px; color: #A9A3C2">вокзал (м. р.)</span>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; text-align: left; font-family: 'IBM Plex Sans', sans-serif; font-size: 17px; line-height: 26px">
<span>Ich warte am Bahnhof.</span>
<span style="color: #A9A3C2">Я жду на вокзале.</span>
</span>
<span style="font-size: 18px; color: #A9A3C2">TAP TO FLIP BACK</span>
</sc-if>
</button>
<div style="display: flex; justify-content: center">
<button type="button" aria-label="Play pronunciation" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; background: transparent; border: 2px solid #2EE6D6; color: #2EE6D6; font-size: 22px; letter-spacing: 2px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z M17 9a4 4 0 0 1 0 6"></path></svg>LISTEN</button>
</div>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button type="button" style="height: 64px; background: transparent; border: 2px solid #FF3D8B; color: #FF3D8B; font-family: 'Bungee', sans-serif; font-size: 16px; cursor: pointer">← AGAIN</button>
<a href="Listen.dc.html" style="display: flex; align-items: center; justify-content: center; height: 64px; background: #FFD23F; color: #120E24; font-family: 'Bungee', sans-serif; font-size: 16px; box-shadow: 4px 4px 0 #FF3D8B">KNEW IT →</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { flipped: false };
renderVals() {
const f = this.state.flipped;
return {
front: !f,
back: f,
flip: () => this.setState({ flipped: !f }),
cardStyle: 'height: 360px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; cursor: pointer; color: #F3EFE6; border: 2px solid #5A4E96; box-shadow: 4px 4px 0 #FF3D8B; background: ' + (f ? '#251E48' : '#1B1636') + ';'
};
}
}
</script>
</body>
</html>
