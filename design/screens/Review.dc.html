<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review due words</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=VT323&amp;family=Pixelify+Sans&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 16px; display: flex; flex-direction: column; gap: 16px; background-color: #120E24; background-image: repeating-linear-gradient(0deg, rgba(243,239,230,0.04) 0, rgba(243,239,230,0.04) 1px, transparent 1px, transparent 4px); color: #F3EFE6; font-family: 'VT323', 'Pixelify Sans', monospace; font-size: 22px">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 24px; letter-spacing: 2px">
<span style="color: #2EE6D6">DAILY REVIEW</span>
<span style="color: #A9A3C2">2 / 5</span>
</div>
<h1 style="margin: 0; font-family: 'Bungee', sans-serif; font-weight: 400; font-size: 34px; line-height: 1; text-shadow: 3px 0 #FF3D8B, -3px 0 #2EE6D6">WHICH ONE?</h1>
<div style="display: flex; justify-content: space-between; font-size: 20px; color: #A9A3C2"><span>LEARNING · INTERVAL 7 DAYS</span><span>FROM LESSON 9</span></div>
<div style="height: 280px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; background: #1B1636; border: 2px solid #5A4E96; box-shadow: 4px 4px 0 #FF3D8B">
<span style="font-family: 'IBM Plex Sans', sans-serif; font-size: 17px; color: #A9A3C2">холодильник</span>
<span style="font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 36px; line-height: 42px"><span style="{{gapStyle}}">{{gap}}</span> Kühlschrank</span>
<sc-if value="{{answered}}" hint-placeholder-val="{{true}}">
<span style="font-family: 'IBM Plex Sans', sans-serif; font-size: 17px; line-height: 26px">Pl. die Kühlschränke · <span style="color: #A9A3C2">Der Kühlschrank ist leer.</span></span>
</sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{arts}}" as="a" hint-placeholder-count="3">
<button type="button" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="{{a.style}}">{{a.label}}</button>
</sc-for>
</div>
<div style="font-size: 20px; line-height: 1.1; color: {{fbColor}}">{{feedback}}</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
<a href="Review.dc.html" style="display: flex; align-items: center; justify-content: center; height: 64px; background: #FFD23F; color: #120E24; font-family: 'Bungee', sans-serif; font-size: 20px; box-shadow: 4px 4px 0 #FF3D8B">NEXT CARD</a>
<nav aria-label="Main" style="margin: 0 -24px -16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 16px; border-top: 2px solid #5A4E96; background: #120E24">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 18px; letter-spacing: 2px; color: #A9A3C2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 11 L12 4 L21 11 V20 H3 Z M10 20 V14 H14 V20"></path></svg>HOME</a>
<a href="Lessons.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 18px; letter-spacing: 2px; color: #FFD23F; box-shadow: inset 0 3px 0 #FFD23F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 5 H10 a2 2 0 0 1 2 2 V20 a2 2 0 0 0 -2 -2 H3 Z M21 5 H14 a2 2 0 0 0 -2 2 V20 a2 2 0 0 1 2 -2 H21 Z"></path></svg>LESSONS</a>
<a href="Score.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 18px; letter-spacing: 2px; color: #A9A3C2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M7 4 H17 V10 a5 5 0 0 1 -10 0 Z M7 6 H4 V8 a3 3 0 0 0 3 3 M17 6 H20 V8 a3 3 0 0 1 -3 3 M12 15 V19 M8 20 H16"></path></svg>SCORE</a>
<a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 18px; letter-spacing: 2px; color: #A9A3C2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M5 20 V13 M11 20 V6 M17 20 V10 M2 21 H22"></path></svg>STATS</a>
</nav>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { pick: 'der' };
renderVals() {
const p = this.state.pick;
const colors = { der: '#5AA9FF', die: '#FF6B6B', das: '#4ADE80' };
const right = 'der';
const base = 'min-height: 56px; font-family: \'IBM Plex Sans\', sans-serif; font-weight: 600; font-size: 20px; cursor: pointer; ';
const arts = ['der', 'die', 'das'].map((v) => {
let style = base + 'background: #1B1636; border: 2px solid #7A6CC4; color: #F3EFE6;';
if (p && v === right) style = base + 'background: ' + colors[v] + '; border: 2px solid ' + colors[v] + '; color: #120E24;';
else if (p === v) style = base + 'background: #1B1636; border: 2px solid #FF3D8B; color: #FF3D8B;';
return { label: (p === v ? (v === right ? '✓ ' : '✗ ') : '') + v, pressed: p === v ? 'true' : 'false', pick: () => this.setState({ pick: v }), style };
});
const ok = p === right;
return {
arts,
answered: !!p,
gap: p ? right : '___',
gapStyle: p ? 'color: ' + colors[right] : 'color: #A9A3C2',
feedback: !p ? 'PICK THE ARTICLE' : ok ? '✓ CORRECT. NEXT REVIEW IN 14 DAYS.' : '✗ IT IS DER. BACK TO 1 DAY.',
fbColor: !p ? '#A9A3C2' : ok ? '#2EE6D6' : '#FF3D8B'
};
}
}
</script>
</body>
</html>
