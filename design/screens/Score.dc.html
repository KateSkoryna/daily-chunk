<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const done = 13;
const list = [
[0, 'ROOKIE RECRUIT', ''],
[10, 'TEXAS RANGER', ''],
[20, 'SERGEANT PAINFUL', ''],
[30, 'LIEUTENANT MACHO-NEY', ''],
[40, 'CAPTAIN MARVELOUS', ''],
[50, 'MAJOR TROUBLE', ''],
[60, 'SHERIFF NO-MERCY', ''],
[70, 'CHIEF CHUNK', '']
];
const ranks = list.map((r, i) => {
const next = list[i + 1] ? list[i + 1][0] : Infinity;
const current = done >= r[0] && done < next;
const earned = done >= next;
return {
at: String(r[0]),
name: r[1],
meaning: r[2],
tag: current ? '◀ YOU' : earned ? '✓' : (r[0] - done) + ' TO GO',
tagColor: current ? '#FFD23F' : earned ? '#2EE6D6' : '#A9A3C2',
numColor: current ? '#120E24' : '#A9A3C2',
row: 'display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; ' + (i ? 'border-top: 2px solid #251E48; ' : '') + (current ? 'background: #FFD23F; color: #120E24;' : earned ? 'color: #F3EFE6;' : 'color: #A9A3C2;')
};
});
ranks.forEach((r) => { if (r.tag === '◀ YOU') r.tagColor = '#120E24'; });
return { ranks };
}
}
</script>
