<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boss round test</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=VT323&amp;family=Pixelify+Sans&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 16px; display: flex; flex-direction: column; gap: 16px; background-color: #120E24; background-image: repeating-linear-gradient(0deg, rgba(243,239,230,0.04) 0, rgba(243,239,230,0.04) 1px, transparent 1px, transparent 4px); color: #F3EFE6; font-family: 'VT323', 'Pixelify Sans', monospace; font-size: 22px">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 24px; letter-spacing: 2px">
<a href="Main.dc.html" aria-label="Quit test" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #2EE6D6"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M3 3 L17 17 M17 3 L3 17"></path></svg></a>
<span role="img" aria-label="2 of 3 lives left" style="display: flex; gap: 6px"><i style="display: block; width: 18px; height: 18px; background: #FF3D8B"></i><i style="display: block; width: 18px; height: 18px; background: #FF3D8B"></i><i style="display: block; width: 18px; height: 18px; box-sizing: border-box; border: 2px solid #5A4E96"></i></span>
<span style="color: #FFD23F">1840</span>
</div>
<h1 style="margin: 0; font-family: 'Bungee', sans-serif; font-weight: 400; font-size: 34px; line-height: 1; text-shadow: 3px 0 #FF3D8B, -3px 0 #2EE6D6">BOSS ROUND</h1>
<div role="progressbar" aria-label="Test part 3 of 3" aria-valuemin="1" aria-valuemax="3" aria-valuenow="3" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; font-size: 18px; letter-spacing: 1px">
<span style="display: flex; flex-direction: column; gap: 4px; color: #2EE6D6"><i style="display: block; height: 8px; background: #2EE6D6; border-radius: 2px"></i>A · TYPE IT 9/10</span>
<span style="display: flex; flex-direction: column; gap: 4px; color: #2EE6D6"><i style="display: block; height: 8px; background: #2EE6D6; border-radius: 2px"></i>B · PICK 1/3 8/10</span>
<span style="display: flex; flex-direction: column; gap: 4px; color: #FFD23F"><i style="display: block; height: 8px; background: #FFD23F; border-radius: 2px"></i>C · BUILD 2/5</span>
</div>
</div>
<div style="font-size: 22px; color: #FF3D8B; letter-spacing: 2px">BUILD THE SENTENCE</div>
<p style="margin: 0; font-family: 'IBM Plex Sans', sans-serif; font-size: 20px; line-height: 30px">Я жду на вокзале уже час.</p>
<div aria-label="Your answer" style="display: flex; flex-wrap: wrap; gap: 8px; min-height: 120px; box-sizing: border-box; padding: 12px; background: #1B1636; border: 2px solid #2EE6D6; align-content: flex-start">
<sc-for list="{{answer}}" as="w" hint-placeholder-count="2">
<button type="button" onClick="{{w.remove}}" style="height: 48px; padding: 0 14px; background: #251E48; border: 2px solid #FFD23F; color: #F3EFE6; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 18px; cursor: pointer">{{w.text}}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{pool}}" as="w" hint-placeholder-count="5">
<button type="button" onClick="{{w.add}}" style="height: 48px; padding: 0 14px; background: #1B1636; border: 2px solid #7A6CC4; color: #F3EFE6; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 18px; cursor: pointer">{{w.text}}</button>
</sc-for>
</div>
<div style="font-size: 18px; color: #A9A3C2">TAP A TILE TO ADD · TAP IT AGAIN TO REMOVE · ONE EXTRA TILE IS A TRAP</div>
<div style="margin-top: auto">
<a href="Done.dc.html" style="display: flex; align-items: center; justify-content: center; height: 64px; background: #FFD23F; color: #120E24; font-family: 'Bungee', sans-serif; font-size: 20px; box-shadow: 4px 4px 0 #FF3D8B">CHECK</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { picked: [1, 3] };
renderVals() {
const tiles = ['Bahnhof', 'Ich', 'seit', 'warte', 'am', 'im', 'einer Stunde'];
const picked = this.state.picked;
const answer = picked.map((i) => ({ text: tiles[i], remove: () => this.setState({ picked: picked.filter((x) => x !== i) }) }));
const pool = tiles.map((t, i) => ({ t, i })).filter((o) => !picked.includes(o.i)).map((o) => ({ text: o.t, add: () => this.setState({ picked: [...picked, o.i] }) }));
return { answer, pool };
}
}
</script>
</body>
</html>
