<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task 5 Gap fill</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=VT323&amp;family=Pixelify+Sans&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 16px; display: flex; flex-direction: column; gap: 16px; background-color: #120E24; background-image: repeating-linear-gradient(0deg, rgba(243,239,230,0.04) 0, rgba(243,239,230,0.04) 1px, transparent 1px, transparent 4px); color: #F3EFE6; font-family: 'VT323', 'Pixelify Sans', monospace; font-size: 22px">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 24px; letter-spacing: 2px">
<a href="Record.dc.html" aria-label="Back" style="display: flex; align-items: center; gap: 8px; min-height: 44px; color: #2EE6D6"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M10 2 L4 8 L10 14"></path></svg><span>BACK</span></a>
<span style="color: #A9A3C2">2 / 5</span>
</div>
<div role="progressbar" aria-label="Lesson step 5 of 6" aria-valuemin="1" aria-valuemax="6" aria-valuenow="5" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 20px; letter-spacing: 2px"><span style="color: #FF3D8B">05 / FILL THE GAP</span><span style="color: #A9A3C2">+80 XP</span></div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px"><i style="display: block; height: 8px; background: #2EE6D6; border-radius: 2px"></i><i style="display: block; height: 8px; background: #2EE6D6; border-radius: 2px"></i><i style="display: block; height: 8px; background: #2EE6D6; border-radius: 2px"></i><i style="display: block; height: 8px; background: #2EE6D6; border-radius: 2px"></i><i style="display: block; height: 8px; background: #FFD23F; border-radius: 2px"></i><i style="display: block; height: 8px; background: #251E48; border-radius: 2px"></i></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 20px; color: #A9A3C2; letter-spacing: 1px">A · PICK THE ARTICLE</div>
<p style="margin: 0; font-family: 'IBM Plex Sans', sans-serif; font-size: 20px; line-height: 30px">Der Zug fährt <span style="{{artGapStyle}}">{{artGap}}</span> Gleis drei.</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{arts}}" as="a" hint-placeholder-count="3">
<button type="button" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="{{a.style}}">{{a.label}}</button>
</sc-for>
</div>
<div style="font-size: 18px; line-height: 1.1; color: #A9A3C2">von + dem = vom. "Gleis" is das → dem.</div>
</div>
<div style="height: 2px; background: #5A4E96"></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 20px; color: #A9A3C2; letter-spacing: 1px">B · PICK THE WORD</div>
<p style="margin: 0; font-family: 'IBM Plex Sans', sans-serif; font-size: 20px; line-height: 30px">Sie sucht ihre <span style="{{wordGapStyle}}">{{wordGap}}</span> in der Tasche.</p>
<p style="margin: -4px 0 0; font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; line-height: 22px; color: #A9A3C2">Она ищет свой билет в сумке.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{words}}" as="w" hint-placeholder-count="4">
<button type="button" onClick="{{w.pick}}" aria-pressed="{{w.pressed}}" style="{{w.style}}">{{w.label}}</button>
</sc-for>
</div>
</div>
<div style="margin-top: auto">
<a href="Translate.dc.html" style="display: flex; align-items: center; justify-content: center; height: 64px; background: #FFD23F; color: #120E24; font-family: 'Bungee', sans-serif; font-size: 20px; box-shadow: 4px 4px 0 #FF3D8B">CHECK</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { art: 'vom', word: 'Fahrkarten' };
renderVals() {
const base = 'min-height: 56px; font-family: \'IBM Plex Sans\', sans-serif; font-weight: 600; font-size: 18px; cursor: pointer; ';
const opt = (val, chosen, right) => {
if (chosen === val && val === right) return base + 'background: #1B1636; border: 2px solid #2EE6D6; color: #2EE6D6;';
if (chosen === val) return base + 'background: #1B1636; border: 2px solid #FF3D8B; color: #FF3D8B;';
if (chosen !== right && val === right) return base + 'background: #1B1636; border: 2px dashed #2EE6D6; color: #2EE6D6;';
return base + 'background: #1B1636; border: 2px solid #7A6CC4; color: #F3EFE6;';
};
const mark = (val, chosen, right) => (chosen === val ? (val === right ? '✓ ' : '✗ ') : '') + val;
const a = this.state.art, w = this.state.word;
const arts = ['vom', 'von der', 'von den'].map((v) => ({ label: mark(v, a, 'vom'), pressed: a === v ? 'true' : 'false', pick: () => this.setState({ art: v }), style: opt(v, a, 'vom') }));
const words = ['Fahrkarte', 'Fahrkarten', 'Bahnhof', 'Gleis'].map((v) => ({ label: mark(v, w, 'Fahrkarte'), pressed: w === v ? 'true' : 'false', pick: () => this.setState({ word: v }), style: opt(v, w, 'Fahrkarte') }));
const gap = (ok) => 'display: inline-block; min-width: 110px; text-align: center; font-weight: 600; border-bottom: 3px solid ' + (ok ? '#2EE6D6' : '#FF3D8B') + '; color: ' + (ok ? '#2EE6D6' : '#FF3D8B') + ';';
return {
arts, words,
artGap: a, artGapStyle: gap(a === 'vom'),
wordGap: w, wordGapStyle: gap(w === 'Fahrkarte')
};
}
}
</script>
</body>
</html>
