<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm words</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=VT323&amp;family=Pixelify+Sans&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 16px; display: flex; flex-direction: column; gap: 16px; background-color: #120E24; background-image: repeating-linear-gradient(0deg, rgba(243,239,230,0.04) 0, rgba(243,239,230,0.04) 1px, transparent 1px, transparent 4px); color: #F3EFE6; font-family: 'VT323', 'Pixelify Sans', monospace; font-size: 22px">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 24px; letter-spacing: 2px">
<a href="Main.dc.html" aria-label="Back to home" style="display: flex; align-items: center; gap: 8px; min-height: 44px; color: #2EE6D6"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M10 2 L4 8 L10 14"></path></svg><span>BACK</span></a>
<span style="color: #A9A3C2">4 WORDS</span>
</div>
<h1 style="margin: 0; font-family: 'Bungee', sans-serif; font-weight: 400; font-size: 34px; line-height: 1; text-shadow: 3px 0 #FF3D8B, -3px 0 #2EE6D6">CHECK WORDS</h1>
<p style="margin: 0; font-size: 22px; color: #A9A3C2; line-height: 1.1">I found the dictionary form, article and translation. Tap a row to fix it.</p>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<button type="button" aria-label="{{r.aria}}" style="display: flex; align-items: center; gap: 12px; min-height: 84px; box-sizing: border-box; padding: 10px 12px; background: #1B1636; border: 2px solid #5A4E96; color: #F3EFE6; text-align: left; cursor: pointer">
<span style="{{r.chipStyle}}">{{r.art}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 20px; line-height: 26px">{{r.word}}</span>
<span style="font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; line-height: 20px; color: #A9A3C2">{{r.forms}}</span>
<span style="font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; line-height: 20px; color: #F3EFE6">{{r.ru}}</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2EE6D6" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 2px dashed #FFB547; font-size: 20px; line-height: 1.1; color: #FFB547">
<span>YOU WROTE "Bahnhöfe" (PLURAL). SAVED AS der Bahnhof.</span>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<a href="Flashcards.dc.html" style="display: flex; align-items: center; justify-content: center; height: 64px; background: #FFD23F; color: #120E24; font-family: 'Bungee', sans-serif; font-size: 20px; box-shadow: 4px 4px 0 #FF3D8B">START LESSON</a>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; font-size: 22px; letter-spacing: 2px; color: #A9A3C2">+ ADD MORE WORDS</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const chip = (c, dashed) => 'flex: none; display: flex; align-items: center; justify-content: center; width: 52px; height: 32px; box-sizing: border-box; font-family: \'IBM Plex Sans\', sans-serif; font-weight: 600; font-size: 16px; ' + (dashed ? 'border: 2px dashed ' + c + '; color: ' + c + ';' : 'background: ' + c + '; color: #120E24;');
const rows = [
{ art: 'der', c: '#5AA9FF', word: 'der Bahnhof', forms: 'Pl. die Bahnhöfe', ru: 'вокзал' },
{ art: 'die', c: '#FF6B6B', word: 'die Fahrkarte', forms: 'Pl. die Fahrkarten', ru: 'билет (на проезд)' },
{ art: 'ADJ', c: '#A9A3C2', word: 'verspätet', forms: 'adjective / participle of verspäten', ru: 'опоздавший, с опозданием', dashed: true },
{ art: 'das', c: '#4ADE80', word: 'das Gleis', forms: 'Pl. die Gleise', ru: 'путь, платформа' }
];
return { rows: rows.map((r) => ({ ...r, chipStyle: chip(r.c, r.dashed), aria: 'Edit ' + r.word + ', ' + r.ru })) };
}
}
</script>
</body>
</html>
