<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=VT323&amp;family=Pixelify+Sans&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background-color: #120E24; background-image: repeating-linear-gradient(0deg, rgba(243,239,230,0.04) 0, rgba(243,239,230,0.04) 1px, transparent 1px, transparent 4px); color: #F3EFE6; font-family: 'VT323', 'Pixelify Sans', monospace; font-size: 22px">
<a href="Main.dc.html" aria-label="Close menu" style="position: absolute; inset: 0; background: rgba(7,6,15,0.78)"></a>
<nav aria-label="App menu" style="position: absolute; top: 0; left: 0; bottom: 0; width: 312px; box-sizing: border-box; padding: 48px 20px 24px; display: flex; flex-direction: column; gap: 18px; background: #1B1636; border-right: 2px solid #FFD23F; box-shadow: 6px 0 0 #FF3D8B">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; align-items: center; gap: 10px">
<svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><polygon points="13,2 15.94,8.95 23.46,9.6 17.76,14.55 19.47,21.9 13,18 6.53,21.9 8.24,14.55 2.54,9.6 10.06,8.95" fill="#FF3D8B"></polygon><polygon points="12,1 14.94,7.95 22.46,8.6 16.76,13.55 18.47,20.9 12,17 5.53,20.9 7.24,13.55 1.54,8.6 9.06,7.95" fill="#FFD23F"></polygon><circle cx="12" cy="12.4" r="4.6" fill="#120E24"></circle><text x="12" y="14.1" text-anchor="middle" font-family="Bungee, sans-serif" font-size="4.6" fill="#F3EFE6">DC</text></svg>
<span style="font-family: 'Bungee', sans-serif; font-size: 18px">DAILY CHUNK</span>
</span>
<a href="Main.dc.html" aria-label="Close menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2EE6D6"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M3 3 L17 17 M17 3 L3 17"></path></svg></a>
</div>
<a href="Account.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #251E48; color: #F3EFE6">
<span style="width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; background: #2EE6D6; color: #120E24; font-family: 'Bungee', sans-serif; font-size: 20px">K</span>
<span style="display: flex; flex-direction: column; line-height: 1"><span style="font-size: 24px">KATE</span><span style="font-size: 19px; color: #FFD23F">TEXAS RANGER</span></span>
</a>
<div style="display: flex; flex-direction: column">
<sc-for list="{{items}}" as="i" hint-placeholder-count="7">
<a href="{{i.href}}" style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 8px; border-bottom: 2px solid #251E48; color: #F3EFE6; font-size: 23px; letter-spacing: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2EE6D6" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="{{i.icon}}"></path></svg>
<span style="flex: 1">{{i.label}}</span>
<span style="{{i.badgeStyle}}">{{i.badge}}</span>
</a>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
<a href="Main.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 8px; color: #FF3D8B; font-size: 22px; letter-spacing: 2px">LOG OUT</a>
<span style="padding: 0 8px; font-size: 18px; color: #A9A3C2">VERSION 0.1 · MADE IN BERLIN</span>
</div>
</nav>
</div>
</x-dc>

</script>
</body>
</html>
