<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home · Add words</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&amp;family=Handjet&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit;padding:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; position: relative; background-color: #120E24; background-image: repeating-linear-gradient(0deg, rgba(243,239,230,0.04) 0, rgba(243,239,230,0.04) 1px, transparent 1px, transparent 4px); color: #F3EFE6; font-family: 'Handjet', monospace; font-size: 22px">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Menu.dc.html" aria-label="Menu" style="display: flex; align-items: center; gap: 8px; min-height: 48px; color: #A9A3C2; font-size: 24px; letter-spacing: 2px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M4 7 H20 M4 12 H20 M4 17 H20"></path></svg><span>MENU</span></a>
<svg width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Daily Chunk"><path d="M24 3 L30 17 L45 18 L33 28 L37 43 L24 35 L11 43 L15 28 L3 18 L18 17 Z" fill="#FFD23F" stroke="#FF3D8B" stroke-width="2"></path><circle cx="24" cy="25" r="8" fill="#120E24"></circle><text x="24" y="29" text-anchor="middle" font-family="Russo One" font-size="10" fill="#FFD23F">DC</text></svg>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-family: 'Russo One', sans-serif; font-size: 16px; color: #FFD23F">1240 <span style="font-family: Handjet, monospace; font-size: 18px">XP</span></span><span style="font-size: 18px; color: #2EE6D6">STREAK 12</span></div>
</div>
<h1 style="margin: 0; font-family: 'Russo One', sans-serif; font-weight: 400; font-size: 46px; line-height: 46px; color: #F3EFE6; text-shadow: -3px 0 0 #FF3D8B, 3px 0 0 #2EE6D6">DAILY CHUNK</h1>
<div style="position: relative; border: 2px solid #FFD23F; padding: 24px 14px 14px">
<span style="position: absolute; top: -13px; left: 12px; padding: 0 8px; background: #FFD23F; color: #120E24; font-size: 20px; letter-spacing: 2px">CHUNK SAYS</span>
<p style="margin: 0; font-size: 24px; line-height: 26px">Chunk doesn't look up articles. Articles look up to Chunk. Bring me today's words.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 20px; letter-spacing: 2px"><span style="color: #FF3D8B">BOSS ROUND IN 2 LESSONS</span><span style="color: #A9A3C2">3/5</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px"><i style="height: 8px; background: #2EE6D6"></i><i style="height: 8px; background: #2EE6D6"></i><i style="height: 8px; background: #2EE6D6"></i><i style="height: 8px; background: #251E48"></i><i style="height: 8px; background: #251E48"></i></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 24px; letter-spacing: 2px; color: #FF3D8B">01 / ADD TODAY'S WORDS</span>
<sc-for list="{{fields}}" as="field" hint-placeholder-count="3">
<div style="display: flex; gap: 8px">
<label style="flex: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">{{field.label}}</span><input value="{{field.value}}" placeholder="{{field.placeholder}}" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 12px; background: #1B1636; border: 2px solid #2EE6D6; color: #F3EFE6; font-family: 'IBM Plex Sans', sans-serif; font-size: 17px"></label>
<button type="button" onClick="{{field.remove}}" aria-label="{{field.removeLabel}}" style="{{field.removeStyle}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M4 4 L20 20 M20 4 L4 20"></path></svg></button>
</div>
</sc-for>
<button type="button" onClick="{{add}}" style="{{addStyle}}">+ ADD A WORD</button>
<div style="display: flex; justify-content: space-between; font-size: 18px"><span style="color: #A9A3C2">{{countText}}</span><a href="Review.dc.html" style="color: #2EE6D6">5 DUE FOR REVIEW ›</a></div>
</div>
<a href="Confirm.dc.html" style="display: flex; align-items: center; justify-content: center; height: 64px; flex: none; border: 0; background: #FFD23F; color: #120E24; font-family: 'Russo One', sans-serif; font-size: 20px; box-shadow: 4px 4px 0 #FF3D8B; cursor: pointer; margin-top: auto">CHECK MY WORDS</a>
<nav aria-label="Tabs" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0 -24px -16px; border-top: 2px solid #5A4E96; background: #120E24">
<a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 12px; border-top: 3px solid #FFD23F; margin-top: -2px; color: #FFD23F; font-size: 22px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 11 L12 4 L21 11 V20 H3 Z M10 20 V14 H14 V20"></path></svg><span>Home</span></a>
<a href="Lessons.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 12px; color: #A9A3C2; font-size: 22px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 5 H10 a2 2 0 0 1 2 2 V20 a2 2 0 0 0 -2 -2 H3 Z M21 5 H14 a2 2 0 0 0 -2 2 V20 a2 2 0 0 1 2 -2 H21 Z"></path></svg><span>Lessons</span></a>
<a href="Score.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 12px; color: #A9A3C2; font-size: 22px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M7 4 H17 V10 a5 5 0 0 1 -10 0 Z M7 6 H4 V8 a3 3 0 0 0 3 3 M17 6 H20 V8 a3 3 0 0 1 -3 3 M12 15 V19 M8 20 H16"></path></svg><span>Score</span></a>
<a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 12px; color: #A9A3C2; font-size: 22px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 20 V13 M11 20 V6 M17 20 V10 M2 21 H22"></path></svg><span>Stats</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { values: ['Bahnhof', 'Fahrkarte', 'Gleis'] };
renderVals() {
const values = this.state.values;
const filled = values.filter((value) => value.trim()).length;
const fields = values.map((value, index) => {
const canRemove = value !== '' || index >= 3;
return {
value,
label: 'Word ' + (index + 1),
placeholder: index === 0 ? 'Any form: Bahnhöfe, ging…' : '',
removeLabel: 'Remove word ' + (index + 1),
remove: () => this.setState({ values: index >= 3 ? values.filter((_, other) => other !== index) : values.map((other, position) => position === index ? '' : other) }),
removeStyle: canRemove ? 'width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; background: transparent; border: 2px solid #7A6CC4; color: #F3EFE6; cursor: pointer' : 'width: 48px; height: 48px; flex: none; visibility: hidden'
};
});
return {
fields,
add: () => { if (values.length < 6) this.setState({ values: [...values, ''] }); },
addStyle: values.length < 6 ? 'height: 56px; background: transparent; border: 2px solid #2EE6D6; color: #2EE6D6; font-family: \'Russo One\', sans-serif; font-size: 16px; cursor: pointer' : 'display: none',
countText: filled + ' / 6 WORDS · MIN 3'
};
}
}
</script>
</body>
</html>
