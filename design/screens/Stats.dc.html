<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=VT323&amp;family=Pixelify+Sans&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 0; display: flex; flex-direction: column; gap: 14px; background-color: #120E24; background-image: repeating-linear-gradient(0deg, rgba(243,239,230,0.04) 0, rgba(243,239,230,0.04) 1px, transparent 1px, transparent 4px); color: #F3EFE6; font-family: 'VT323', 'Pixelify Sans', monospace; font-size: 22px">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Menu.dc.html" aria-label="Open menu" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 2px solid #7A6CC4; color: #F3EFE6"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M4 7 H20 M4 12 H20 M4 17 H20"></path></svg></a>
<svg width="40" height="40" viewBox="0 0 24 24" role="img" aria-label="Daily Chunk"><polygon points="13,2 15.94,8.95 23.46,9.6 17.76,14.55 19.47,21.9 13,18 6.53,21.9 8.24,14.55 2.54,9.6 10.06,8.95" fill="#FF3D8B"></polygon><polygon points="12,1 14.94,7.95 22.46,8.6 16.76,13.55 18.47,20.9 12,17 5.53,20.9 7.24,13.55 1.54,8.6 9.06,7.95" fill="#FFD23F"></polygon><circle cx="12" cy="12.4" r="4.6" fill="#120E24"></circle><text x="12" y="14.1" text-anchor="middle" font-family="Bungee, sans-serif" font-size="4.6" fill="#F3EFE6">DC</text></svg>
<span style="min-width: 48px; text-align: right; font-size: 22px; color: #2EE6D6"><span style="font-family: 'Bungee', sans-serif; font-size: 18px; color: #FFD23F">1240</span> XP</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: 'Bungee', sans-serif; font-weight: 400; font-size: 34px; line-height: 1; text-shadow: 3px 0 #FF3D8B, -3px 0 #2EE6D6">STATS</h1>
<div role="tablist" aria-label="Period" style="display: flex; border: 2px solid #5A4E96">
<sc-for list="{{periods}}" as="p" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{p.sel}}" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; background: #1B1636; border: 2px solid #5A4E96">
<div style="display: flex; justify-content: space-between; font-size: 20px; letter-spacing: 1px"><span style="color: #FF3D8B">WORDS LEARNED</span><span style="color: #A9A3C2">{{total}}</span></div>
<div role="img" aria-label="{{chartAria}}" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 120px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%">
<span style="font-size: 16px; color: #A9A3C2">{{b.v}}</span>
<i style="{{b.style}}"></i>
</div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; text-align: center; font-size: 16px; color: #A9A3C2">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="7"><span>{{b.d}}</span></sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; background: #1B1636; border: 2px solid #5A4E96">
<div style="font-size: 20px; letter-spacing: 1px; color: #FF3D8B">ARTICLE ACCURACY</div>
<div style="display: grid; grid-template-columns: 48px 1fr 44px; gap: 8px 10px; align-items: center; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px">
<span style="color: #5AA9FF">der</span><span style="height: 12px; background: #251E48"><i style="display: block; width: 91%; height: 100%; background: #5AA9FF"></i></span><span style="text-align: right">91%</span>
<span style="color: #FF6B6B">die</span><span style="height: 12px; background: #251E48"><i style="display: block; width: 84%; height: 100%; background: #FF6B6B"></i></span><span style="text-align: right">84%</span>
<span style="color: #4ADE80">das</span><span style="height: 12px; background: #251E48"><i style="display: block; width: 62%; height: 100%; background: #4ADE80"></i></span><span style="text-align: right">62%</span>
</div>
<div style="font-size: 18px; color: #A9A3C2">DAS IS YOUR WEAK SPOT: 6 DAS-WORDS GO TO TOMORROW'S REVIEW.</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center">
<div style="display: flex; flex-direction: column; padding: 10px 0; border: 2px solid #2EE6D6"><span style="font-family: 'Bungee', sans-serif; font-size: 20px; color: #2EE6D6">86%</span><span style="font-size: 17px; color: #A9A3C2">SPEECH</span></div>
<div style="display: flex; flex-direction: column; padding: 10px 0; border: 2px solid #FFD23F"><span style="font-family: 'Bungee', sans-serif; font-size: 20px; color: #FFD23F">74 MIN</span><span style="font-size: 17px; color: #A9A3C2">PRACTICE</span></div>
<div style="display: flex; flex-direction: column; padding: 10px 0; border: 2px solid #FF3D8B"><span style="font-family: 'Bungee', sans-serif; font-size: 20px; color: #FF3D8B">31</span><span style="font-size: 17px; color: #A9A3C2">LEARNED</span></div>
</div>
<nav aria-label="Main" style="margin: auto -24px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 16px; border-top: 2px solid #5A4E96; background: #120E24">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 18px; letter-spacing: 2px; color: #A9A3C2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 11 L12 4 L21 11 V20 H3 Z M10 20 V14 H14 V20"></path></svg>HOME</a>
<a href="Lessons.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 18px; letter-spacing: 2px; color: #A9A3C2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 5 H10 a2 2 0 0 1 2 2 V20 a2 2 0 0 0 -2 -2 H3 Z M21 5 H14 a2 2 0 0 0 -2 2 V20 a2 2 0 0 1 2 -2 H21 Z"></path></svg>LESSONS</a>
<a href="Score.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 18px; letter-spacing: 2px; color: #A9A3C2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M7 4 H17 V10 a5 5 0 0 1 -10 0 Z M7 6 H4 V8 a3 3 0 0 0 3 3 M17 6 H20 V8 a3 3 0 0 1 -3 3 M12 15 V19 M8 20 H16"></path></svg>SCORE</a>
<a href="Stats.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 18px; letter-spacing: 2px; color: #FFD23F; box-shadow: inset 0 3px 0 #FFD23F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M5 20 V13 M11 20 V6 M17 20 V10 M2 21 H22"></path></svg>STATS</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { period: 'WEEK' };
renderVals() {
const p = this.state.period;
const data = p === 'WEEK'
? [['MO', 4], ['TU', 5], ['WE', 0], ['TH', 6], ['FR', 4], ['SA', 2], ['SU', 4]]
: [['W1', 18], ['W2', 22], ['W3', 15], ['W4', 25], ['W5', 9], ['W6', 0], ['W7', 0]];
const max = Math.max.apply(null, data.map((d) => d[1])) || 1;
const bars = data.map((d, i) => ({
d: d[0], v: d[1] ? String(d[1]) : '',
style: 'display: block; width: 100%; height: ' + Math.max(4, Math.round((d[1] / max) * 88)) + 'px; background: ' + (d[1] === 0 ? '#251E48' : (i === (p === 'WEEK' ? 6 : 4) ? '#FFD23F' : '#2EE6D6')) + ';'
}));
const total = data.reduce((s, d) => s + d[1], 0);
const periods = ['WEEK', 'MONTH'].map((v) => ({ label: v, sel: p === v ? 'true' : 'false', pick: () => this.setState({ period: v }), style: 'min-height: 40px; padding: 0 10px; border: 0; cursor: pointer; font-size: 20px; letter-spacing: 1px; ' + (p === v ? 'background: #251E48; color: #FFD23F;' : 'background: transparent; color: #A9A3C2;') }));
return { bars, periods, total: total + ' THIS ' + p, chartAria: total + ' words learned this ' + p.toLowerCase() };
}
}
</script>
</body>
</html>
