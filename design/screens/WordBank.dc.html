<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Word bank</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=VT323&amp;family=Pixelify+Sans&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
button,input{font-family:inherit}
input::placeholder{color:#A9A3C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 16px; display: flex; flex-direction: column; gap: 14px; background-color: #120E24; background-image: repeating-linear-gradient(0deg, rgba(243,239,230,0.04) 0, rgba(243,239,230,0.04) 1px, transparent 1px, transparent 4px); color: #F3EFE6; font-family: 'VT323', 'Pixelify Sans', monospace; font-size: 22px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: 'Bungee', sans-serif; font-weight: 400; font-size: 34px; line-height: 1; text-shadow: 3px 0 #FF3D8B, -3px 0 #2EE6D6">WORD BANK</h1>
<a href="Menu.dc.html" aria-label="Open menu" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 2px solid #7A6CC4; color: #F3EFE6"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M4 7 H20 M4 12 H20 M4 17 H20"></path></svg></a>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center">
<div style="display: flex; flex-direction: column; padding: 8px 0; background: #1B1636"><span style="font-family: 'Bungee', sans-serif; font-size: 22px; color: #FFD23F">86</span><span style="font-size: 18px; color: #A9A3C2">TOTAL</span></div>
<div style="display: flex; flex-direction: column; padding: 8px 0; background: #1B1636"><span style="font-family: 'Bungee', sans-serif; font-size: 22px; color: #2EE6D6">31</span><span style="font-size: 18px; color: #A9A3C2">LEARNED</span></div>
<div style="display: flex; flex-direction: column; padding: 8px 0; background: #1B1636"><span style="font-family: 'Bungee', sans-serif; font-size: 22px; color: #F3EFE6">42</span><span style="font-size: 18px; color: #A9A3C2">LEARNING</span></div>
<div style="display: flex; flex-direction: column; padding: 8px 0; background: #1B1636"><span style="font-family: 'Bungee', sans-serif; font-size: 22px; color: #FF3D8B">13</span><span style="font-size: 18px; color: #A9A3C2">NEW</span></div>
</div>
<div>
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search words</label>
<input id="q" type="search" placeholder="Search German or Russian…" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 12px; background: #1B1636; border: 2px solid #2EE6D6; color: #F3EFE6; font-family: 'IBM Plex Sans', sans-serif; font-size: 17px">
</div>
<div role="tablist" aria-label="Status" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 2px solid #5A4E96">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 8px">
<span style="display: flex; align-items: center; height: 32px; padding: 0 10px; background: #5AA9FF; color: #120E24; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px">der</span>
<span style="display: flex; align-items: center; height: 32px; padding: 0 10px; background: #FF6B6B; color: #120E24; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px">die</span>
<span style="display: flex; align-items: center; height: 32px; padding: 0 10px; background: #4ADE80; color: #120E24; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px">das</span>
<span style="display: flex; align-items: center; height: 32px; padding: 0 10px; box-sizing: border-box; border: 2px dashed #A9A3C2; color: #F3EFE6; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px">other</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; min-height: 60px; box-sizing: border-box; padding: 8px 12px; background: #1B1636; border: 2px solid #5A4E96">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; font-family: 'IBM Plex Sans', sans-serif">
<span style="font-weight: 600; font-size: 18px; line-height: 24px"><span style="{{r.artStyle}}">{{r.art}}</span> {{r.word}}</span>
<span style="font-size: 15px; line-height: 20px; color: #A9A3C2">{{r.ru}}</span>
</span>
<span role="img" aria-label="{{r.aria}}" style="display: flex; gap: 3px">
<sc-for list="{{r.pips}}" as="p" hint-placeholder-count="5"><i style="{{p.style}}"></i></sc-for>
</span>
</div>
</sc-for>
</div>
<nav aria-label="Main" style="margin: auto -24px -16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 16px; border-top: 2px solid #5A4E96; background: #120E24">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 18px; letter-spacing: 2px; color: #A9A3C2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 11 L12 4 L21 11 V20 H3 Z M10 20 V14 H14 V20"></path></svg>HOME</a>
<a href="Lessons.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 18px; letter-spacing: 2px; color: #A9A3C2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 5 H10 a2 2 0 0 1 2 2 V20 a2 2 0 0 0 -2 -2 H3 Z M21 5 H14 a2 2 0 0 0 -2 2 V20 a2 2 0 0 1 2 -2 H21 Z"></path></svg>LESSONS</a>
<a href="Score.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 18px; letter-spacing: 2px; color: #A9A3C2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M7 4 H17 V10 a5 5 0 0 1 -10 0 Z M7 6 H4 V8 a3 3 0 0 0 3 3 M17 6 H20 V8 a3 3 0 0 1 -3 3 M12 15 V19 M8 20 H16"></path></svg>SCORE</a>
<a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; font-size: 18px; letter-spacing: 2px; color: #A9A3C2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M5 20 V13 M11 20 V6 M17 20 V10 M2 21 H22"></path></svg>STATS</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { tab: 'LEARNING' };
renderVals() {
const t = this.state.tab;
const tabs = ['NEW', 'LEARNING', 'LEARNED'].map((v) => ({
label: v,
sel: t === v ? 'true' : 'false',
pick: () => this.setState({ tab: v }),
style: 'min-height: 44px; border: 0; cursor: pointer; font-size: 20px; letter-spacing: 2px; ' + (t === v ? 'background: #251E48; color: #FFD23F;' : 'background: transparent; color: #A9A3C2;')
}));
const C = { der: '#5AA9FF', die: '#FF6B6B', das: '#4ADE80', '': '#F3EFE6' };
const data = [
['der', 'Bahnhof', 'вокзал', 1],
['die', 'Fahrkarte', 'билет', 1],
['der', 'Kühlschrank', 'холодильник', 3],
['das', 'Gleis', 'путь, платформа', 1],
['', 'verspätet', 'с опозданием', 2]
];
const rows = data.map((d) => ({
art: d[0], word: d[1], ru: d[2],
artStyle: 'color: ' + C[d[0]],
aria: 'Review stage ' + d[3] + ' of 5',
pips: [1, 2, 3, 4, 5].map((i) => ({ style: 'display: block; width: 8px; height: 16px; border-radius: 2px; background: ' + (i <= d[3] ? '#2EE6D6' : '#251E48') }))
}));
return { tabs, rows };
}
}
</script>
</body>
</html>
