name: Storybook

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: deploy-storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.token.outputs.present == 'true'
        run: npx nx run @daily-chunk/app:build-storybook

      - id: deploy
        if: steps.token.outputs.present == 'true'
        working-directory: apps/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PRODUCTION_FLAG: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
        run: |
          npx --yes eas-cli@27.5.0 deploy --export-dir storybook-static --non-interactive --json ${PRODUCTION_FLAG:+"$PRODUCTION_FLAG"} > deploy.json
          url=$(jq -r '.url' deploy.json)
          if [ -z "$url" ] || [ "$url" = "null" ]; then echo "no deploy URL found in deploy.json" >&2; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - if: steps.token.outputs.present == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          STORYBOOK_URL: ${{ steps.deploy.outputs.url }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PULL_REQUEST_NUMBER" --edit-last --create-if-none --body "Storybook preview $STORYBOOK_URL"
