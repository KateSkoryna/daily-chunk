name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npx playwright install --with-deps chromium
        working-directory: apps/app

      - run: npx prettier --check .

      - run: npx nx affected -t lint typecheck test --base=${{ github.event_name == 'pull_request' && 'origin/main' || github.event.before }} --head=HEAD

      - run: npx nx run @daily-chunk/app:export:web
