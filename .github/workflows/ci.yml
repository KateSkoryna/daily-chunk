name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || github.event.before }}

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx prettier --check .

  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: npx nx affected -t lint typecheck --base="$NX_BASE" --head=HEAD

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
        working-directory: apps/app
      - run: npx nx affected -t test --base="$NX_BASE" --head=HEAD

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx nx run @daily-chunk/app:export:web

  deploy-storybook:
    name: deploy-storybook
    needs: [format, lint-typecheck, test, build]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.token.outputs.present == 'true'
        run: npx nx run @daily-chunk/app:build-storybook

      - id: deploy
        if: steps.token.outputs.present == 'true'
        working-directory: apps/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PRODUCTION_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
        run: |
          npx --yes eas-cli@27.5.0 deploy --export-dir storybook-static --non-interactive --json ${PRODUCTION_FLAG:+"$PRODUCTION_FLAG"} > deploy.json
          url=$(jq -r '.url' deploy.json)
          if [ -z "$url" ] || [ "$url" = "null" ]; then echo "no deploy URL found in deploy.json" >&2; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - if: steps.token.outputs.present == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          STORYBOOK_URL: ${{ steps.deploy.outputs.url }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PULL_REQUEST_NUMBER" --edit-last --create-if-none --body "Storybook preview $STORYBOOK_URL"
